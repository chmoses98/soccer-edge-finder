name: archive-compact

# Monthly compaction of closed day files on data-archive (docs/ARCHIVE_COMPACTION.md): gzip, manifest-aware,
# never deletes evidence, never rewrites history. Dry run by default.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "apply the compaction and push (default: dry run)"
        type: boolean
        default: false
  schedule:
    - cron: "37 3 2 * *"

concurrency:
  group: data-writer-archive-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Fetch archive tip
        run: |
          git clone --quiet --depth 1 --branch data-archive "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" archive
      - name: Plan
        run: python -m soccer_edge.cli archive compact --archive-dir archive | tee plan.log
      - name: Apply + verify + publish
        if: ${{ inputs.apply || github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m soccer_edge.cli archive compact --archive-dir archive --apply
          python -m soccer_edge.cli archive verify --archive-dir archive
          cd archive
          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to compact"; exit 0; fi
          git commit -qm "archive: compact closed day files $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push --quiet origin HEAD:data-archive && break; git pull --rebase -q origin data-archive; sleep 3; done
      - run: |
          { echo '## archive-compact'; echo '```'; cat plan.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
