name: probe-espn-xg

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-espn-xg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/probe_espn_xg.py
      - name: Commit trimmed samples to this branch
        run: |
          git config user.name "soccer-edge-bot"; git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add data/samples/espn_xg_probe.json
          git diff --cached --quiet && echo "no change" || (git commit -m "samples: espn/xg probe $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})
