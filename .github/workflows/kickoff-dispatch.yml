name: kickoff-dispatch
run-name: "kickoff-dispatch · ${{ inputs.source || github.event.client_payload.source || github.event_name }}"

# The ONE canonical dispatcher, fixture-aware and bounded (docs/SCHEDULER.md). No external heartbeat.
#
#   decide   stdlib, ~15 s, every trigger: record a heartbeat, dispatch settlement when due, and start a
#            capture LINK only when a known fixture window exists (or something is due / missed / stale)
#            and no link is alive. No known future window -> NO_WORK_DUE, nothing else runs.
#   capture  one bounded LINK (<= 5 h 30): holds the chain lease, sleeps until each real fixture window
#            (no calls while sleeping), captures when due, publishes after every batch, refreshes the
#            schedule every 30 min, and ends at its time limit or when no future window remains.
#            LIVE SLATE (docs/ACTIONABLE_SLATE.md): every batch reprices the cached model board on its own
#            Kalshi sweep (runs/latest.actionable_slate.v1.json); the model reruns only at T-60, at T-15 when
#            an input changed, or when a cached fixture is invalidated/missing; between horizons, while a
#            fixture kicks off within 12 h, a free Kalshi capture + reprice runs every 15 min (no paid call).
#   chain    after a link that reached its time limit with windows still ahead (and ran >= 20 min),
#            dispatches exactly one successor link. A chain therefore exists only while fixtures do.
#
# Triggers: the chain itself (workflow_dispatch source=chain); completion of the other data workflows
# (workflow_run: event-driven restarts after a stopped/broken chain); an hourly GitHub schedule (backup
# only; GitHub drops most slots); manual runs. External callers (workflow_dispatch / repository_dispatch)
# still work but are not required. Paid Odds API calls stay behind the quota guard, claims and the
# durable per-call caps regardless of how or how often this workflow is triggered.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "trigger source label (chain | manual)"
        type: string
        default: manual
      force:
        description: "run the capture link even when nothing is due"
        type: boolean
        default: false
      with_run:
        description: "model run at EVERY due horizon (default: selective - T-60, T-15 on input change, invalidated)"
        type: boolean
        default: false
  repository_dispatch:
    types: [wake-soccer-dispatcher]
  workflow_run:
    workflows: [run-soccer, kalshi-discover, kalshi-capture, espn-lineups, settle-evaluate]
    types: [completed]
  schedule:
    - cron: "7 * * * *"  # hourly BACKUP restart of a stopped chain; GitHub drops most slots

permissions:
  contents: write  # heartbeat rows, claims, archive publish (data-archive branch)
  actions: write   # dispatch settle-evaluate; read in-progress runs

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      capture: ${{ steps.d.outputs.capture }}
      reason: ${{ steps.d.outputs.reason }}
      source: ${{ steps.d.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/kickoff_decide.py
            src/soccer_edge/dispatch
            config/dispatch.json
          sparse-checkout-cone-mode: false
      - name: Wake (stdlib only, no install)
        id: d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_SOURCE: ${{ inputs.source || github.event.client_payload.source }}
          FORCE: ${{ inputs.force }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/kickoff_decide.py wake
      - run: echo "wake source=${{ steps.d.outputs.source }} capture=${{ steps.d.outputs.capture }} settle=${{ steps.d.outputs.settle_dispatched }} (${{ steps.d.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"

  capture:
    needs: decide
    if: ${{ needs.decide.outputs.capture == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub-hosted job limit is 360 min; the link itself ends at 330
    outputs:
      chain_continue: ${{ steps.tick.outputs.chain_continue }}
      elapsed_minutes: ${{ steps.tick.outputs.elapsed_minutes }}
    concurrency:
      group: data-writer-archive-kickoff
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Persist the simulation cache across links (keys are content hashes of every pricing input)
        uses: actions/cache@v4
        with:
          path: simcache
          key: simcache-kickoff-${{ github.run_id }}
          restore-keys: |
            simcache-kickoff-
            simcache-
      - name: Fetch archive tip (schedule, log, heartbeats, change-suppression state, ESPN fixtures)
        run: |
          git clone --quiet --depth 1 --branch data-archive "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" archive
      - name: Bounded link (capture every due horizon, sleep until the next real window)
        id: tick
        timeout-minutes: 345
        env:
          # The SAME Odds API key/secret name as chmoses98/edge-finder-api (shared account). Absent -> the
          # Pinnacle reference action logs NOT_CONFIGURED and makes no request. Never echoed.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # claims on data-archive before paid calls
        run: |
          set -o pipefail
          mkdir -p work
          EXTRA=""
          [ "${{ inputs.with_run }}" = "true" ] && EXTRA="--with-run"
          python -m soccer_edge.cli dispatch tick --archive-dir archive --out-dir work --chain --max-tick-minutes 330 --refresh-minutes 30 --publish-each-batch --summary-out tick_summary.json --sim-cache-dir simcache --slate-refresh-minutes 15 --slate-active-hours 12 $EXTRA | tee work/tick.log
          python3 -c "import json;t=json.load(open('tick_summary.json'));print('chain_continue='+('true' if t.get('chain_continue') else 'false'));print('elapsed_minutes='+str(int(t.get('elapsed_minutes') or 0)))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kickoff-${{ github.run_id }}
          path: work/
          retention-days: 7
      - name: Publish (final)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/kickoff_publish.sh work "kickoff-dispatch ${{ github.run_id }} $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Record capture completion heartbeat
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_SOURCE: ${{ inputs.source || github.event.client_payload.source }}
        run: python3 scripts/kickoff_decide.py complete --tick-summary tick_summary.json --status "${{ job.status }}"
      - name: Summary
        if: always()
        run: |
          { echo '## kickoff-dispatch'; echo '```'; tail -40 work/tick.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

  chain:
    needs: [decide, capture]
    # exactly one successor: after a link that used its time with windows still ahead, or after a link that
    # FAILED having run >= 20 min (recovery). A link that ended early, failed fast or was cancelled never
    # chains (scripts/kickoff_decide.py chain_decision); event-driven restarts and the hourly backup cover it.
    if: ${{ always() && needs.decide.outputs.capture == 'true' && (needs.capture.result == 'success' || needs.capture.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/kickoff_decide.py
            src/soccer_edge/dispatch
            config/dispatch.json
          sparse-checkout-cone-mode: false
      - name: Dispatch the successor link (or stop the chain)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
          CHAIN_CONTINUE: ${{ needs.capture.outputs.chain_continue }}
          ELAPSED_MINUTES: ${{ needs.capture.outputs.elapsed_minutes }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/kickoff_decide.py chain
