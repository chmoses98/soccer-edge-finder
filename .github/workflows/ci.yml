name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts research && ruff format --check src tests scripts research
      - name: App-contract schemas are in sync
        run: |
          python -m soccer_edge.cli export-schemas --out /tmp/schemas >/dev/null
          diff -r /tmp/schemas docs/schemas
      - name: Tests
        run: pytest -q --maxfail=3
      - name: Workflow lint (no scheduled writers without a concurrency group)
        run: python scripts/check_workflows.py
