name: espn-backfill

# One-off / incremental backfill of FT results from ESPN per-day scoreboards (runner-side) into the private
# data-archive branch under results/espn/<league>.jsonl (append-only, deduplicated by ESPN event id).
# Used to give the Americas leagues and the international pool a results history to fit strengths on.

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: comma-separated ESPN slugs
        default: "usa.1,mex.1,bra.1,arg.1,uefa.nations,fifa.friendly,fifa.worldq.uefa,fifa.worldq.conmebol,fifa.worldq.concacaf,concacaf.nations.league"
      start:
        description: YYYY-MM-DD
        default: "2024-07-01"

concurrency:
  group: espn-lineups
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore existing ESPN results
        run: |
          mkdir -p work/espn/results/espn
          git fetch --depth 1 origin data-archive 2>/dev/null || true
          for f in $(git ls-tree --name-only origin/data-archive:results/espn 2>/dev/null); do
            git show "origin/data-archive:results/espn/$f" > "work/espn/results/espn/$f" 2>/dev/null || true
          done
      - name: Backfill
        timeout-minutes: 110
        run: |
          set -o pipefail
          python -m soccer_edge.cli espn-backfill --leagues "${{ inputs.leagues }}" --start "${{ inputs.start }}" --out-dir work/espn | tee work/backfill.log
      - name: Publish results to data-archive
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub/results
          [ -d work/espn/results ] && cp -R work/espn/results/. pub/results/ || true
          scripts/archive_publish.sh pub . "espn-backfill ${{ github.run_id }} $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Status
        if: always()
        run: |
          mkdir -p data/diagnostics
          cp work/espn/BACKFILL_STATUS.json data/diagnostics/latest_espn_backfill.json 2>/dev/null || true
          git config user.name "soccer-edge-bot"; git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add data/diagnostics/latest_espn_backfill.json 2>/dev/null || true
          git diff --cached --quiet && echo "no change" || (git commit -m "diagnostics: espn backfill $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})
