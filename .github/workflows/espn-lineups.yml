name: espn-lineups

# Prospective ESPN capture (runner-side; the dev container cannot reach ESPN): fixtures window for the
# verified leagues, point-in-time lineup snapshots (change-suppressed, append-only) and identity-map
# proposals. Snapshots go to the private data-archive branch under lineups/ and fixtures/espn/;
# STATUS.json (counts + unmapped ids) is committed to data/diagnostics/ on the calling branch.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: espn-lineups
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore last lineup hashes + existing ESPN results (append-only dedup)
        run: |
          mkdir -p work/espn/lineups work/espn/results/espn
          git fetch --depth 1 origin data-archive 2>/dev/null || true
          git show origin/data-archive:lineups/last_hashes.json > work/espn/lineups/last_hashes.json 2>/dev/null || true
          mkdir -p work/espn/weather
          git show origin/data-archive:weather/geocode_cache.json > work/espn/weather/geocode_cache.json 2>/dev/null || true
          for f in $(git ls-tree --name-only origin/data-archive:results/espn 2>/dev/null); do
            git show "origin/data-archive:results/espn/$f" > "work/espn/results/espn/$f" 2>/dev/null || true
          done
      - name: ESPN sync
        id: sync
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"  # progress reaches the log even if the step is killed at its time limit
        run: |
          set -o pipefail
          python -m soccer_edge.cli espn-sync --out-dir work/espn | tee work/espn.log
          # archive growth (phase 22 / audit §O4): keep the fixtures dump only when its content changed
          python - <<'PY'
          import hashlib, json, subprocess, pathlib
          new = sorted(pathlib.Path("work/espn/fixtures/espn").glob("*/*.json"))
          if new:
              def body(doc):
                  d = json.loads(doc); d.pop("as_of", None); return hashlib.sha256(json.dumps(d, sort_keys=True).encode()).hexdigest()
              try:
                  files = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "origin/data-archive", "fixtures/espn"], text=True).split()
                  files = sorted(f for f in files if f.endswith(".json"))
                  if files:
                      prev = subprocess.check_output(["git", "show", f"origin/data-archive:{files[-1]}"], text=True)
                      if body(prev) == body(new[-1].read_text()):
                          new[-1].unlink(); print("fixtures dump unchanged; not archived")
              except Exception as exc:
                  print("fixtures dedupe skipped:", exc)
          PY
      - name: Publish snapshots to data-archive
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub/lineups pub/fixtures/espn
          [ -d work/espn/lineups ] && cp -R work/espn/lineups/. pub/lineups/ || true
          [ -d work/espn/fixtures ] && cp -R work/espn/fixtures/. pub/fixtures/espn/ || true
          if [ -d work/espn/results ]; then mkdir -p pub/results; cp -R work/espn/results/. pub/results/; fi
          if [ -d work/espn/weather ]; then mkdir -p pub/weather; cp -R work/espn/weather/. pub/weather/; fi
          scripts/archive_publish.sh pub . "espn ${{ github.run_id }} $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Commit status to branch
        if: always()
        run: |
          mkdir -p data/diagnostics
          [ -f work/espn/STATUS.json ] && cp work/espn/STATUS.json data/diagnostics/latest_espn_status.json || echo 'no STATUS.json'
          git config user.name "soccer-edge-bot"; git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add data/diagnostics/latest_espn_status.json
          git diff --cached --quiet && echo "no change" || (git commit -m "diagnostics: espn status $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})
      # The ONE enforcement point: STATUS.json["health"] (written by espn-sync) decides the colour.
      # HEALTHY -> green; DEGRADED (partial ESPN / lineup failures, weather budget hit) -> green + warning;
      # FAILED (no fixture window, all due lineup fetches failed, STATUS.json missing) -> red.
      - name: Health
        if: always()
        run: python3 scripts/health_gate.py work/espn/STATUS.json --label espn-lineups --upstream-outcome "${{ steps.sync.outcome }}"
