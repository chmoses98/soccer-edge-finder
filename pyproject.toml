[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "soccer-edge"
version = "0.1.0"
description = "Soccer match world-model and exhaustive Kalshi market-pricing research system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
]

[project.scripts]
soccer = "soccer_edge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_edge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PL"]
ignore = [
  "PLR0913",  # many arguments are normal for pricing/config functions
  "PLR2004",  # magic numbers in tests and pricing rules are documented inline
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "RUF012",
  "E501",
  "SIM108",
  "B905",
  "RUF007",
  "UP042",
  "PLC0415",
  "PLW2901",
  "N806",
  "N803",
  "E731",
  "B023",
  "RUF001",
  "RUF059",
  "N818",
  "B007",
  "RUF005",
  "SIM101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "N", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
filterwarnings = ["error::DeprecationWarning:soccer_edge.*"]

[tool.coverage.run]
source = ["soccer_edge"]
